<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Qareeb (قريب) — Local Services Booking Marketplace</title>
  <meta name="description" content="Modern bilingual interactive UI prototype for a local services booking marketplace. Barbers, Salons, Spas, and Beauty Centers." />
  <meta name="theme-color" content="#D97706" />

  <!-- Google Fonts for English & Arabic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design System & Component Styles -->
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<body>
  <!-- Single Page Reactive Application Root -->
  <div id="app-root">
    <!-- Initial Loading Fallback -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: #D97706; font-family: sans-serif;">
      <div style="width: 48px; height: 48px; border: 4px solid #FEF3C7; border-top-color: #D97706; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <h2 style="font-weight: 700; font-size: 1.25rem;">Qareeb (قريب) Marketplace Loading...</h2>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <noscript>
    <div style="padding: 2rem; text-align: center; color: #DC2626; font-family: sans-serif;">
      Please enable JavaScript to explore the interactive Qareeb marketplace prototype.
    </div>
  </noscript>

  <!-- Prototype Scripts (Loaded in strictly resolved dependency order) -->
  <script src="js/translations.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/auth-api.js"></script>
  <script src="js/discovery-api.js"></script>
  <script src="js/components/account.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/navigation.js"></script>
  <script src="js/components/customer-home.js"></script>
  <script src="js/components/search-results.js"></script>
  <script src="js/components/provider-profile.js"></script>
  <script src="js/components/booking-modal.js"></script>
  <script src="js/components/my-bookings.js"></script>
  <script src="js/components/provider-portal.js"></script>
  <script src="js/components/admin-portal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
